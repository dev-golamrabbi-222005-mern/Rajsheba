version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: rajsheba-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://neondb_owner:npg_MDh0Vyjn8eWZ@ep-green-darkness-bd4ijfu3-pooler.c-8.us-east-2.aws.neon.tech/rajsheba?sslmode=require&sslaccept=accept_invalid_certs
      - JWT_SECRET=rajseba_super_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:3000
    restart: always

  invoices-api:
    build:
      context: ./apps/invoices-api
      dockerfile: Dockerfile
    container_name: rajsheba-invoices-api
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=postgresql://neondb_owner:npg_MDh0Vyjn8eWZ@ep-green-darkness-bd4ijfu3-pooler.c-8.us-east-2.aws.neon.tech/rajsheba?sslmode=require&sslaccept=accept_invalid_certs
    restart: always

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: rajsheba-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - api
    restart: always
